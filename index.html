<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Общий чек-лист покупок</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; }
    h1 { text-align: center; }
    .form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .form-row { display: flex; gap: 8px; }
    .form-row input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .form-row button { padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .form-row button:disabled { background: #6c757d; }
    .form-row button:hover:not(:disabled) { background: #218838; }
    #list { list-style: none; padding: 0; }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-bottom: 1px solid #eee;
      transition: background 0.2s;
    }
    .item:hover { background: #f8f9fa; }
    .item img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
      background: #eee;
      cursor: pointer;
    }
    .item .text {
      flex: 1;
      word-break: break-word;
      cursor: pointer;
    }
    .item .text.done {
      text-decoration: line-through;
      color: #999;
    }
    .item .toggle {
      font-size: 24px;
      user-select: none;
      cursor: pointer;
      width: 30px;
      text-align: center;
      color: #6c757d;
      flex-shrink: 0;
    }
    .item .toggle.done {
      color: #28a745;
    }
    .item .toggle:hover {
      transform: scale(1.2);
    }
    .item .link-icon {
      font-size: 18px;
      color: #007bff;
      flex-shrink: 0;
      cursor: pointer;
    }
    .item .link-icon:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>🛒 Общий список покупок</h1>
  <div class="form">
    <div class="form-row">
      <input type="text" id="newItem" placeholder="Название товара (можно оставить пустым для авто-заполнения)...">
      <button id="addBtn">Добавить</button>
    </div>
    <div class="form-row">
      <input type="url" id="newLink" placeholder="Ссылка на товар (Wildberries, Ozon и др.)">
    </div>
  </div>
  <ul id="list"></ul>

  <script>
    // ========== НАСТРОЙКА FIREBASE ==========
    const firebaseConfig = {
      apiKey: "AIzaSyDMuSZYq1VTJgV0_lOC6m2D3EHFtC6Qg3A",
      authDomain: "baby-828f3.firebaseapp.com",
      databaseURL: "https://baby-828f3-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "baby-828f3",
      storageBucket: "baby-828f3.firebasestorage.app",
      messagingSenderId: "681679551177",
      appId: "1:681679551177:web:bfc81b1c34d9b83c316b18",
      measurementId: "G-MNKH507MG6"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const itemsRef = database.ref('items');

    // ========== ЭЛЕМЕНТЫ HTML ==========
    const listEl = document.getElementById('list');
    const inputText = document.getElementById('newItem');
    const inputLink = document.getElementById('newLink');
    const addBtn = document.getElementById('addBtn');

    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
    // Извлечение названия из URL (fallback)
    function extractNameFromUrl(url) {
      try {
        const parsed = new URL(url);
        // Убираем протокол и домен, оставляем путь
        let path = parsed.pathname.replace(/^\/+|\/+$/g, ''); // убираем слеши в начале и конце
        if (!path) return parsed.hostname;
        // Берём последний сегмент пути
        const segments = path.split('/');
        let last = segments[segments.length - 1];
        // Убираем расширения (например, .html, .aspx и т.п.)
        last = last.replace(/\.[^/.]+$/, '');
        // Декодируем URL-кодировку (например, %20 -> пробел)
        last = decodeURIComponent(last);
        // Заменяем дефисы и подчеркивания на пробелы
        last = last.replace(/[-_]/g, ' ');
        // Если слишком длинное, обрезаем
        if (last.length > 40) last = last.substring(0, 40) + '…';
        return last || parsed.hostname;
      } catch {
        return url; // если не удалось распарсить, возвращаем как есть
      }
    }

    // Получение метаданных через Microlink
    async function fetchMetadata(url) {
      try {
        const response = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        console.log('Microlink ответ:', data); // для отладки
        if (data.status === 'fail') throw new Error(data.message || 'Не удалось извлечь данные');
        return {
          title: data.data?.title || '',
          image: data.data?.image?.url || data.data?.logo?.url || ''
        };
      } catch (error) {
        console.warn('Не удалось получить метаданные:', error);
        return { title: '', image: '' };
      }
    }

    // ========== ОСНОВНЫЕ ФУНКЦИИ ==========
    function render(snapshot) {
      const data = snapshot.val();
      listEl.innerHTML = '';
      if (!data) return;

      const items = Object.keys(data).map(key => ({
        id: key,
        text: data[key].text || '',
        link: data[key].link || '',
        image: data[key].image || '',
        done: data[key].done || false
      }));

      items.forEach((item) => {
        const li = document.createElement('li');
        li.className = 'item';

        // Картинка
        if (item.image) {
          const img = document.createElement('img');
          img.src = item.image;
          img.alt = item.text || 'Товар';
          img.loading = 'lazy';
          if (item.link) {
            img.addEventListener('click', (e) => {
              e.stopPropagation();
              window.open(item.link, '_blank');
            });
          }
          li.appendChild(img);
        }

        // Текст
        const textSpan = document.createElement('span');
        textSpan.className = 'text' + (item.done ? ' done' : '');
        textSpan.textContent = item.text || 'Без названия';
        if (item.link) {
          textSpan.addEventListener('click', (e) => {
            e.stopPropagation();
            window.open(item.link, '_blank');
          });
        }
        li.appendChild(textSpan);

        // Галочка
        const toggleSpan = document.createElement('span');
        toggleSpan.className = 'toggle' + (item.done ? ' done' : '');
        toggleSpan.textContent = item.done ? '✅' : '⬜';
        toggleSpan.title = 'Отметить как купленное';
        toggleSpan.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleItem(item.id);
        });
        li.appendChild(toggleSpan);

        // Иконка ссылки
        if (item.link) {
          const linkIcon = document.createElement('span');
          linkIcon.className = 'link-icon';
          linkIcon.textContent = '🔗';
          linkIcon.title = 'Открыть ссылку';
          linkIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            window.open(item.link, '_blank');
          });
          li.appendChild(linkIcon);
        }

        listEl.appendChild(li);
      });
    }

    function toggleItem(id) {
      const itemRef = itemsRef.child(id);
      itemRef.transaction(current => {
        if (current) {
          current.done = !current.done;
        }
        return current;
      }).catch(error => {
        console.error('Ошибка переключения:', error);
        alert('Не удалось изменить статус: ' + error.message);
      });
    }

    async function addItem() {
      const text = inputText.value.trim();
      const link = inputLink.value.trim();

      if (!text && !link) {
        alert('Введите хотя бы название или ссылку');
        return;
      }

      let image = '';
      let finalText = text;

      if (link) {
        addBtn.disabled = true;
        addBtn.textContent = 'Загрузка...';
        try {
          const meta = await fetchMetadata(link);
          if (meta.image) image = meta.image;
          // Если пользователь не ввел название, используем заголовок или извлекаем из URL
          if (!finalText) {
            if (meta.title) {
              finalText = meta.title;
            } else {
              finalText = extractNameFromUrl(link);
            }
          }
        } catch (e) {
          // ошибка уже обработана внутри fetchMetadata
        } finally {
          addBtn.disabled = false;
          addBtn.textContent = 'Добавить';
        }
      }

      // Если всё ещё нет текста, используем ссылку
      if (!finalText) finalText = link;

      const newItemRef = itemsRef.push();
      newItemRef.set({
        text: finalText,
        link: link,
        image: image,
        done: false
      }).then(() => {
        console.log('Добавлено:', finalText);
        inputText.value = '';
        inputLink.value = '';
      }).catch(error => {
        console.error('Ошибка добавления:', error);
        alert('Не удалось добавить пункт: ' + error.message);
      });
    }

    // Слушаем изменения в реальном времени
    itemsRef.on('value', render);

    // Обработчики событий
    addBtn.addEventListener('click', addItem);
    inputText.addEventListener('keypress', (e) => { if (e.key === 'Enter') addItem(); });
    inputLink.addEventListener('keypress', (e) => { if (e.key === 'Enter') addItem(); });
  </script>
</body>
</html>
