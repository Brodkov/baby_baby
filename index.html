<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Общий чек-лист покупок</title>
  <!-- Подключаем Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    .done { text-decoration: line-through; color: #999; }
    ul { list-style: none; padding: 0; }
    li { cursor: pointer; padding: 8px; border-bottom: 1px solid #eee; }
    li:hover { background: #f5f5f5; }
  </style>
</head>
<body>
  <h1>Общий список покупок</h1>
  <input type="text" id="newItem" placeholder="Введите вещь...">
  <button id="addBtn">Добавить</button>
  <ul id="list"></ul>

  <script>
    // ========== НАСТРОЙКА FIREBASE ==========
    const firebaseConfig = {
      apiKey: "AIzaSyDMuSZYq1VTJgV0_lOC6m2D3EHFtC6Qg3A",
      authDomain: "baby-828f3.firebaseapp.com",
      databaseURL: "https://baby-828f3-default-rtdb.europe-west1.firebasedatabase.app", // ← ДОБАВЛЕНО!
      projectId: "baby-828f3",
      storageBucket: "baby-828f3.firebasestorage.app",
      messagingSenderId: "681679551177",
      appId: "1:681679551177:web:bfc81b1c34d9b83c316b18",
      measurementId: "G-MNKH507MG6"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const itemsRef = database.ref('items');

    // ========== ЭЛЕМЕНТЫ HTML ==========
    const listEl = document.getElementById('list');
    const input = document.getElementById('newItem');
    const addBtn = document.getElementById('addBtn');

    // ========== ФУНКЦИИ ==========
    function render(snapshot) {
      const data = snapshot.val();
      listEl.innerHTML = '';
      if (!data) return;

      const items = Object.keys(data).map(key => ({
        id: key,
        text: data[key].text,
        done: data[key].done
      }));

      items.forEach((item) => {
        const li = document.createElement('li');
        li.textContent = item.text;
        if (item.done) li.classList.add('done');
        li.addEventListener('click', () => toggleItem(item.id));
        listEl.appendChild(li);
      });
    }

    function toggleItem(id) {
      const itemRef = itemsRef.child(id);
      itemRef.transaction(current => {
        if (current) {
          current.done = !current.done;
        }
        return current;
      })
      .catch(error => {
        console.error('Ошибка переключения:', error);
        alert('Не удалось изменить статус: ' + error.message);
      });
    }

    function addItem() {
      const text = input.value.trim();
      if (!text) return;
      const newItemRef = itemsRef.push();
      newItemRef.set({ text, done: false })
        .then(() => {
          console.log('Добавлено:', text);
          input.value = '';
        })
        .catch(error => {
          console.error('Ошибка добавления:', error);
          alert('Не удалось добавить пункт: ' + error.message);
        });
    }

    // Слушаем изменения в базе
    itemsRef.on('value', render);

    addBtn.addEventListener('click', addItem);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') addItem(); });
  </script>
</body>
</html>
